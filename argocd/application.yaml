apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ml-inference-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Brem090/aiops-quality-project
    targetRevision: final-project
    path: helm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m