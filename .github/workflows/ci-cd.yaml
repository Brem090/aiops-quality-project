name: CI/CD Pipeline

on:
  push:
    branches: [ main, final-project ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      retrain:
        description: 'Trigger model retraining'
        required: false
        default: 'false'

env:
  DOCKER_IMAGE: ml-inference-service
  DOCKER_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
      
      - name: Run tests
        run: |
          echo "Running tests..."

  retrain-model:
    runs-on: ubuntu-latest
    if: github.event.inputs.retrain == 'true' || contains(github.event.head_commit.message, '[retrain]')
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn numpy
      
      - name: Train model
        run: |
          cd model
          python train.py
          cd ..
      
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/model.pkl

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, retrain-model]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/final-project'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download model (if retrained)
        if: needs.retrain-model.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/
      
      - name: Build Docker image
        run: |
          cp models/model.pkl app/
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} .
          docker tag ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} ${{ env.DOCKER_IMAGE }}:latest
      
      - name: Update Helm chart version
        run: |
          sed -i "s/tag: .*/tag: \"${{ env.DOCKER_TAG }}\"/" helm/values.yaml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add helm/values.yaml
          git commit -m "Update image tag to ${{ env.DOCKER_TAG }}" || echo "No changes"
