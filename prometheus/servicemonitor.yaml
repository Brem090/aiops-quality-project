apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ml-inference-service
  namespace: ml-service
  labels:
    app: ml-inference-service
    release: monitoring 
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ml-inference-service
  endpoints:
  - port: http
    path: /metrics
    interval: 30s