replicaCount: 1

image:
  repository: ghcr.io/brem090/aiops-quality-project
  pullPolicy: IfNotPresent
  tag: "150b63a110c6b230e5d3827013c2b5cd3a1e2172"

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  limits:
    cpu: 800m
    memory: 1024Mi
  requests:
    cpu: 400m
    memory: 512Mi

env:
  - name: MODEL_PATH
    value: "/app/models/model.pkl"
  - name: LOG_LEVEL
    value: "INFO"
  - name: DRIFT_BACKEND
    value: "zscore"

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
