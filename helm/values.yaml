replicaCount: 1

image:
  repository: ghcr.io/brem090/aiops-quality-project
  pullPolicy: IfNotPresent
  tag: "f1d14bbaa467f6dfdf2bfa8b7a0b66b4ff06fe2d"

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  limits:
    cpu: 400m
    memory: 500Mi
  requests:
    cpu: 250m
    memory: 300Mi

env:
  - name: MODEL_PATH
    value: "/app/models/model.pkl"
  - name: FEATURES_N
    value: "20"
  - name: ZSCORE_THRESHOLD
    value: "3.0"
  - name: PROBA_THRESHOLD
    value: "0.5"
  - name: LOG_LEVEL
    value: "INFO"

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5

