replicaCount: 1

image:
  repository: ghcr.io/brem090/aiops-quality-project
  pullPolicy: IfNotPresent
  tag: "fix-ge"

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  limits:
    cpu: 400m
    memory: 500Mi
  requests:
    cpu: 250m
    memory: 300Mi

env:
  - name: MODEL_PATH
    value: "/app/models/model.pkl"
  - name: LOG_LEVEL
    value: "INFO"
  - name: GE_ENABLE
    value: "true"
  - name: ZSCORE_THRESHOLD 
    value: "3.0"
  - name: FEATURES_N 
    value: "20"

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  
